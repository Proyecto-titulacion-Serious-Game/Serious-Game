name: Tesis VR CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-docs:
    runs-on: self-hosted
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH || '/home/mauros/Unity/Hub/Editor/6000.4.5f1/Editor/Unity' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Ejecución de Pruebas Unitarias ---
      #- name: Ejecutar Pruebas del Core Lógico (Unity EditMode)
        #run: |
          #mkdir -p build
          #"$UNITY_EDITOR" \
            #-batchmode \
            #-nographics \
            #-silent-crashes \
            #-projectPath . \
            #-runTests \
            #-testPlatform EditMode \
            #-testResults build/TestResults.xml \
            #-logFile /dev/stdout

      # Subida de Evidencia ---
      - name: Upload Artifact (Resultados de Pruebas)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SeriousGame-TestResults
          path: build/TestResults.xml
      # ---------------------------------------------------

      #- name: Build Unity (Técnico - Windows)
        #run: |
          #"$UNITY_EDITOR" \
            #-batchmode \
            #-nographics \
            #-silent-crashes \
            #-quit \
            #-projectPath . \
            #-buildTarget Win64 \
            #-executeMethod BuildTecnico.BuildTecnicoBatch \
            #-logFile /dev/stdout

      - name: Generar Doxygen
        run: |
          mkdir -p docs
          doxygen Doxyfile

      - name: Extraer Texto de Documentación
        run: |
          find docs/html/ -name "*.html" -exec lynx -dump -nolist {} \; > documentacion_plana_tesis.txt

      - name: Generar README dinámico
        run: python generate_readme.py

      - name: Copiar Dashboard Docente
        run: |
          mkdir -p docs/html/dashboard

          # Copia asegurando origen (sea Docs o docs en minúsculas)
          if [ -d "Docs/dashboard" ]; then
            cp -r Docs/dashboard/* docs/html/dashboard/
          elif [ -d "docs/dashboard" ]; then
            cp -r docs/dashboard/* docs/html/dashboard/
          fi

          # Crea el archivo para que GitHub Pages no use Jekyll
          touch docs/html/.nojekyll

          # Esto imprimirá en los logs de GitHub la lista de archivos copiados
          echo "=== ARCHIVOS EN DASHBOARD ==="
          ls -la docs/html/dashboard/

      # --- Pasos de Publicación en Web (Pages Primero) ---
      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html/'

      - name: Desplegar Documentación
        id: deployment
        uses: actions/deploy-pages@v4

      # --- Pasos Secundarios (Artifacts y Git Push al FINAL) ---
      - name: Upload Artifact (Técnico)
        uses: actions/upload-artifact@v4
        with:
          name: SeriousGame-Build-Tecnico
          path: Build-Tecnico/

      - name: Upload Artifact (Explorador APK)
        uses: actions/upload-artifact@v4
        with:
          name: SeriousGame-Build-Explorador
          path: Explorador/

      - name: Actualizar Repositorio
        run: |
          git config --global user.name "Mauro Runner Bot"
          git config --global user.email "mauro-bot@users.noreply.github.com"
          git add README.md progreso.txt
          git commit -m "docs: auto-update architecture and progress [skip ci]" || echo "No changes"
          git push
