name: Tesis VR CI/CD 

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-docs:
    runs-on: self-hosted
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH || '/home/mauros/Unity/Hub/Editor/6000.4.5f1/Editor/Unity' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
#
#      - name: Build Unity (Windows)
#        run: |
#          "$UNITY_EDITOR" \
#            -batchmode \
#            -nographics \
#            -silent-crashes \
#            -quit \
#            -projectPath . \
#            -buildWindows64Player "build/SeriousGame.exe" \
#            -logFile /dev/stdout

      - name: Generar Doxygen
        run: |
          mkdir -p docs
          doxygen Doxyfile

      - name: Extraer Texto de Documentación
        run: |
          find docs/html/ -name "*.html" -exec lynx -dump -nolist {} \; > documentacion_plana_tesis.txt

      - name: Generar README dinámico
        run: python generate_readme.py

      - name: Copiar Dashboard Docente y Desactivar Jekyll
        run: |
          mkdir -p docs/html/dashboard
          cp Docs/dashboard/index.html docs/html/dashboard/index.html
          cp Docs/dashboard/cloud.html docs/html/dashboard/cloud.html
          # Evita que GitHub Pages use Jekyll y rompa las rutas de Doxygen/HTML
          touch docs/html/.nojekyll

      # --- Pasos de Publicación en Web (Pages Primero) ---
      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html/'

      - name: Desplegar Documentación
        id: deployment
        uses: actions/deploy-pages@v4

      # --- Pasos Secundarios (Artifacts y Git Push al FINAL) ---
      - name: Upload Artifact (Juego)
        uses: actions/upload-artifact@v4
        with:
          name: SeriousGame-Build-Windows
          path: build/

      - name: Actualizar Repositorio
        run: |
          git config --global user.name "Mauro Runner Bot"
          git config --global user.email "mauro-bot@users.noreply.github.com"
          git add README.md progreso.txt
          git commit -m "docs: auto-update architecture and progress [skip ci]" || echo "No changes"
          git push
