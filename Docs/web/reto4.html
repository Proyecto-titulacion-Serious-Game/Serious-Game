<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 4 — Arduino + Protoboard | Proyecto TITA</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#2ea043; --accent2:#58a6ff;
    --warn:#d29922; --code:#0b0f14; --pin:#f778ba;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.6}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
  header{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:8px}
  h1{font-size:1.9rem;margin:0 0 6px}
  .sub{color:var(--muted);font-size:1.05rem}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:.82rem}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;
        padding:3px 11px;color:var(--muted)}
  .chip a{color:var(--accent2);text-decoration:none}
  section{background:var(--panel);border:1px solid var(--border);border-radius:12px;
          padding:20px 22px;margin-top:20px}
  h2{font-size:1.25rem;margin:0 0 12px;display:flex;align-items:center;gap:9px}
  h2 .ic{font-size:1.1rem}
  .goal{font-size:1.1rem;background:linear-gradient(90deg,rgba(46,160,67,.18),transparent);
        border-left:3px solid var(--accent);padding:12px 16px;border-radius:8px}
  ol,ul{margin:0;padding-left:22px}
  li{margin:6px 0}
  ol.cond li{margin:9px 0}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
       background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:.9em}
  pre{background:var(--code);border:1px solid var(--border);border-radius:8px;
      padding:14px 16px;overflow:auto;font-family:ui-monospace,Consolas,monospace;
      font-size:.85rem;color:#cdd9e5}
  .pin{color:var(--pin)}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.92rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600}
  td.val{font-family:ui-monospace,Consolas,monospace;color:var(--accent2)}
  .flow{counter-reset:step;list-style:none;padding:0}
  .flow li{counter-increment:step;position:relative;padding:8px 0 8px 34px;margin:4px 0}
  .flow li::before{content:counter(step);position:absolute;left:0;top:8px;
       width:22px;height:22px;background:var(--accent2);color:#04101f;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700}
  .fix{border-left:3px solid var(--accent2);padding:8px 14px;margin:10px 0;background:var(--panel2);border-radius:6px}
  .fix code{background:var(--code)}
  .ok{color:var(--accent);font-weight:700}
  .badge{display:inline-block;background:rgba(46,160,67,.15);border:1px solid var(--accent);
         color:var(--accent);border-radius:6px;padding:2px 10px;font-size:.8rem;font-weight:600}
  footer{margin-top:30px;color:var(--muted);font-size:.8rem;text-align:center}
  .err{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap" id="app">Cargando…</div>

<!-- Respaldo embebido: se usa si la página se abre como archivo local (file://) y fetch falla. -->
<script id="reto4-data" type="application/json">
{
  "meta": {
    "titulo": "Reto 4 — Arduino + Protoboard",
    "subtitulo": "Notas técnicas: voltaje del Arduino, validación y modo online",
    "proyecto": "Proyecto TITA — Serious Game de circuitos eléctricos (VR)",
    "actualizado": "2026-06-17",
    "repo": "https://github.com/Proyecto-titulacion-Serious-Game/Serious-Game",
    "branch": "development"
  },
  "objetivo": "Hacer parpadear un LED de forma segura desde un pin digital del Arduino.",
  "comoEntrar": {
    "tecla": "F4",
    "nota": "F4 en Play Mode (DebugLevelSkipper, solo dev/Editor). Confirmación en consola: '[Breadboard] Modo protoboard ON (Reto 4)'. Si aparece '¡Imán activado! ... succionado' NO estás en el Reto 4 (eso es de los Retos 1-3).",
    "cableado": "Pin Dx → Resistencia (≥100 Ω) → LED (ánodo al pin) → GND"
  },
  "condiciones": [
    "Pin en OUTPUT.",
    "blinkEnabled (el sketch debe tener patrón BLINK, no solo HIGH).",
    "El pin tiene nodo eléctrico y existe el nodo GND.",
    "Hay un camino dirigido Pin → … → GND.",
    "Hay un LED en el camino, con el ánodo (pata larga) hacia el pin (si está al revés → 'LED invertido').",
    "Hay una resistencia ≥ 100 Ω en el camino (recomendado 330 Ω).",
    "La corriente estimada ≤ maxSafeCurrent del LED."
  ],
  "arduino": {
    "comoGeneraVoltaje": "En ArduinoCore: con el pin en OUTPUT y en HIGH/blink, DigitalWrite() pone el nodo del pin a 5 V (outputVoltageTTL) y a 0 V en LOW. El sandbox usa esa onda como fuente (srcV = OutputVoltage, srcNodeA = pin, srcNodeB = GND).",
    "nota": "Solo HIGH fijo NO completa el reto: el objetivo es parpadear (condición 2).",
    "pruebaOffline": "En el Inspector de ArduinoCore: activePinMode = OUTPUT y blinkEnabled = true.",
    "sketch": "void setup() {\n  pinMode(13, OUTPUT);\n}\nvoid loop() {\n  digitalWrite(13, HIGH);\n  delay(500);\n  digitalWrite(13, LOW);\n  delay(500);\n}"
  },
  "circuito": {
    "descripcion": "El multímetro lee nodo.voltage/corriente tras resolver el MNA (CircuitGraphAnalyzer.SolveMNA). V_R = I × R.",
    "fuenteV": 5,
    "resistenciaOhm": 330,
    "ledVfV": 2,
    "ledResistenciaInternaOhm": 50,
    "corrienteMa": 7.9,
    "vResistenciaV": 2.6,
    "vLedV": 2.4,
    "formula": "I = (5 − 2) / (330 + 50) ≈ 7.9 mA ; V_R = I × 330 ≈ 2.6 V ; V_LED ≈ 2.4 V (V_R + V_LED ≈ 5 V)",
    "telemetria": "La telemetría del Técnico muestra 5 V fijos a propósito (_sourceVoltage = blinkEnabled ? 5f : srcV) para que el número no salte con el parpadeo."
  },
  "online": {
    "intro": "El GameManager + ProtoboardSimulator viven en la escena del Explorador, no en la del Técnico.",
    "flujo": [
      "Sketch: Técnico → GameSession.RPC_SubirCodigoArduino → ArduinoNetworkBridge.DeliverSketch → ArduinoCore.RecibirCodigoDePC (Explorador).",
      "Componentes: Técnico (ComponentSendingTray.EnviarComponente) → GameSession.RPC_EnviarComponente → OnComponenteRecibido → ExplorerComponentReceiver.SpawnComponente. Resistor = ohms escritos; LED/Cap = +1 (correcta) / -1 (invertida).",
      "Comprobar: el botón del IDE llama GameSession.SolicitarValidacion() → el Explorador corre EvaluarReto4 y publica el resultado por RPC_PublicarDiagnostico, que la consola del IDE muestra."
    ],
    "checklistEscena": [
      "Mesa del Técnico con DeskComponent para resistencia y LED.",
      "ExplorerComponentReceiver con prefabs (ledGreenPrefab, resistorPrefab) y slots / puntoDeEntrega.",
      "ArduinoCore con pinNodeMap poblado (pin→nodo) + nodoGND asignado.",
      "Al jugar: escribir ≥100 Ω (ej. 330) y dejar la polaridad en CORRECTA."
    ]
  },
  "fixes": [
    { "archivo": "UI/ArduinoIDEUI.cs", "cambio": "ComprobarCircuito() pide validación por red (GameSession.SolicitarValidacion) cuando no hay GameManager local → funciona online." },
    { "archivo": "Gameplay/OfflineTestSpawner.cs", "cambio": "Se auto-desactiva cuando hay red (no duplica/falsea componentes); sigue sirviendo offline. Valores: Resistor = 850, LED = 1." },
    { "archivo": "Desktop/ComponentSendingTray.cs", "cambio": "La etiqueta del toggle muestra CORRECTA/INVERTIDA al cambiarlo." }
  ],
  "test": {
    "archivo": "Assets/Scripts/Editor/Reto4VoltageTest.cs",
    "menu": "Tools → TITA → Reto 4 → Test de voltaje (headless)",
    "batch": "Unity.exe -batchmode -nographics -quit -projectPath . -executeMethod Reto4VoltageTest.Run -logFile -",
    "resultado": "OK (exit 0)",
    "salida": [
      "[1]  HIGH → OutputVoltage = 5.00 V | nodo pin = 5.00 V",
      "[1b] LOW  → OutputVoltage = 0.00 V",
      "[2]  MNA=True | I=7.89 mA | V_R=2.61 V | V_LED=2.39 V | LED.isOn=True | estado=Correct",
      "[3]  LED invertido → I=0.000 mA | LED.isOn=False",
      "===== RESULTADO: ✓ OK — el Arduino genera voltaje y el circuito del Reto 4 conduce y es seguro ====="
    ]
  }
}
</script>

<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pinify = s => esc(s).replace(/\bGND\b/g,'<span class="pin">GND</span>')
                         .replace(/\b(Pin|D\d+)\b/g,'<span class="pin">$1</span>');

function render(d){
  const m=d.meta;
  const cond = d.condiciones.map(c=>`<li>${pinify(c)}</li>`).join('');
  const flow = d.online.flujo.map(f=>`<li>${pinify(f)}</li>`).join('');
  const chk  = d.online.checklistEscena.map(c=>`<li>${pinify(c)}</li>`).join('');
  const fixes= d.fixes.map(f=>`<div class="fix"><code>${esc(f.archivo)}</code> — ${esc(f.cambio)}</div>`).join('');
  const c=d.circuito;
  const salida = d.test.salida.map(esc).join('\n');

  document.getElementById('app').innerHTML = `
  <header>
    <h1>${esc(m.titulo)}</h1>
    <div class="sub">${esc(m.subtitulo)}</div>
    <div class="meta">
      <span class="chip">${esc(m.proyecto)}</span>
      <span class="chip">Actualizado: ${esc(m.actualizado)}</span>
      <span class="chip">branch: ${esc(m.branch)}</span>
      <span class="chip"><a href="${esc(m.repo)}" target="_blank" rel="noopener">Repositorio ↗</a></span>
    </div>
  </header>

  <section>
    <h2><span class="ic">🎯</span> Objetivo</h2>
    <div class="goal">${esc(d.objetivo)}</div>
  </section>

  <section>
    <h2><span class="ic">🕹️</span> Cómo entrar y armar</h2>
    <p>Pulsa <code>${esc(d.comoEntrar.tecla)}</code> en Play Mode. ${pinify(d.comoEntrar.nota)}</p>
    <p><strong>Cableado:</strong> <code>${pinify(d.comoEntrar.cableado)}</code></p>
  </section>

  <section>
    <h2><span class="ic">✅</span> Condiciones de victoria</h2>
    <ol class="cond">${cond}</ol>
  </section>

  <section>
    <h2><span class="ic">⚡</span> Cómo genera voltaje el Arduino</h2>
    <p>${pinify(d.arduino.comoGeneraVoltaje)}</p>
    <p class="err">${esc(d.arduino.nota)}</p>
    <p><strong>Prueba offline:</strong> ${esc(d.arduino.pruebaOffline)}</p>
    <pre>${esc(d.arduino.sketch)}</pre>
  </section>

  <section>
    <h2><span class="ic">🔌</span> Cálculo eléctrico</h2>
    <p>${pinify(c.descripcion)}</p>
    <table>
      <tr><th>Magnitud</th><th>Valor</th></tr>
      <tr><td>Fuente (Arduino HIGH)</td><td class="val">${c.fuenteV} V</td></tr>
      <tr><td>Resistencia de protección</td><td class="val">${c.resistenciaOhm} Ω</td></tr>
      <tr><td>LED — caída directa (Vf)</td><td class="val">${c.ledVfV} V</td></tr>
      <tr><td>Corriente</td><td class="val">${c.corrienteMa} mA</td></tr>
      <tr><td>Voltaje en la resistencia</td><td class="val">${c.vResistenciaV} V</td></tr>
      <tr><td>Voltaje en el LED</td><td class="val">${c.vLedV} V</td></tr>
    </table>
    <pre>${esc(c.formula)}</pre>
    <p style="font-size:.9rem;color:var(--muted)">${esc(c.telemetria)}</p>
  </section>

  <section>
    <h2><span class="ic">🌐</span> Modo online</h2>
    <p>${pinify(d.online.intro)}</p>
    <ol class="flow">${flow}</ol>
    <h2 style="font-size:1.05rem;margin-top:16px"><span class="ic">📋</span> Checklist de escena</h2>
    <ul>${chk}</ul>
  </section>

  <section>
    <h2><span class="ic">🛠️</span> Fixes aplicados (${esc(m.actualizado)})</h2>
    ${fixes}
  </section>

  <section>
    <h2><span class="ic">🧪</span> Test de regresión <span class="badge">${esc(d.test.resultado)}</span></h2>
    <p>Archivo: <code>${esc(d.test.archivo)}</code></p>
    <p>Editor: <code>${esc(d.test.menu)}</code></p>
    <p>Batch (Unity cerrado):</p>
    <pre>${esc(d.test.batch)}</pre>
    <p>Salida:</p>
    <pre>${salida}</pre>
  </section>

  <footer>Generado para Proyecto TITA · datos en <code>reto4.json</code></footer>`;
}

(async () => {
  let data;
  try {
    const r = await fetch('reto4.json', {cache:'no-store'});
    if (r.ok) data = await r.json();
  } catch(e){ /* file:// o sin servidor → respaldo embebido */ }
  if (!data) {
    try { data = JSON.parse(document.getElementById('reto4-data').textContent); }
    catch(e){ document.getElementById('app').innerHTML =
      '<p class="err">No se pudieron cargar los datos (reto4.json).</p>'; return; }
  }
  render(data);
})();
</script>
</body>
</html>
